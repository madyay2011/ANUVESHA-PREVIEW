<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ANUVESHA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EEE0;--ink:#1D1B1A;--muted:#5F5A55;--card:#FBF7EE;--line:#1D1B1A22;--on-ink:#F5EEE0;--ok:#1E5B45;--warn:#B5532A;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.logo b{display:block;font:500 26px/1 var(--serif);letter-spacing:.28em}.logo b i{font-style:italic}
.logo small{display:block;margin-top:7px;font:400 10px var(--mono);letter-spacing:.2em;color:var(--muted)}
#gate{min-height:80vh;display:grid;place-items:center;padding:24px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 28px;width:min(400px,100%)}
.gc .logo{margin-bottom:22px}
label{display:block;font:500 13.5px var(--sans);margin-bottom:13px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:260px;line-height:1.6;resize:vertical}
.btn{background:var(--ink);color:var(--on-ink);border:0;border-radius:99px;padding:11px 22px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.hint{font:400 11.5px var(--mono);color:var(--muted);margin:14px 0 0}
.err{color:var(--warn);font-weight:500;min-height:1.4em;margin-top:8px}
#app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside{padding:16px 18px;border-bottom:1px solid var(--line)}
aside nav{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
aside nav button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:500}
aside nav button[aria-current="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.side-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px;font-size:14px}
@media(min-width:860px){#app{grid-template-columns:230px 1fr}aside{border:0;border-right:1px solid var(--line);padding:26px 20px;position:sticky;top:0;height:100vh}
aside nav{flex-direction:column;overflow:visible;margin-top:28px}aside nav button{text-align:left;border-radius:12px;border-color:transparent;background:transparent}
.side-foot{display:flex;flex-direction:column;gap:10px;position:absolute;bottom:24px;left:20px;right:20px;font-size:14px}}
main{padding:22px 18px 60px;max-width:1060px;width:100%}
@media(min-width:860px){main{padding:34px 36px 60px}}
h1{font:400 clamp(34px,5vw,46px)/1.05 var(--serif);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:20px}
.demo{font:400 11.5px var(--mono);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;color:var(--muted);margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.stats b{display:block;font:400 34px/1.1 var(--serif)}.stats span{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2{font:500 24px var(--serif);margin:0 0 12px}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px}.chart div{flex:1;text-align:center;font:400 11px var(--mono);color:var(--muted)}
.chart i{display:block;background:var(--ink);border-radius:6px 6px 0 0;margin-bottom:5px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.row img{width:52px;height:64px;object-fit:cover;border-radius:10px}
.grow{flex:1 1 180px;min-width:0}.grow b{display:block;font-weight:600}.grow small{color:var(--muted);font-size:13px}
.tag{font:400 11px var(--mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.row input[type=number]{width:78px;margin:0;padding:7px 10px}.row select{width:auto;margin:0;padding:7px 10px}
.low{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;font-weight:500;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);flex-basis:100%}
.unread{border-left:4px solid var(--warn)}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--bg);padding:28px;width:min(460px,calc(100% - 24px))}
dialog::backdrop{background:#1d1b1acc}
dialog h2{font-size:30px}
.sz{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.sz label{display:flex;align-items:center;gap:6px;margin:0;border:1px solid var(--line);border-radius:99px;padding:6px 12px}.sz input{width:auto;margin:0}
.acts{display:flex;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--on-ink);padding:11px 22px;border-radius:99px;font-weight:500;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ban{border-radius:12px;padding:11px 16px;text-align:center;font-size:14px}.ban u{font-family:var(--mono);text-decoration:none;border:1px dashed currentColor;border-radius:6px;padding:1px 6px}
details summary{cursor:pointer;font-weight:500;margin:4px 0 14px}
</style>
</head>

<div id="gate">
  <form class="gc" id="gf" novalidate>
    <div class="logo"><b>ANU<i>V</i>ESHA</b><small>ADMIN · STUDIO DASHBOARD</small></div>
    <label>Email<input id="ge" type="email" autocomplete="email"></label>
    <label>Password<input id="gp" type="password" autocomplete="current-password"></label>
    <button class="btn" style="width:100%">Log in</button>
    <div class="err" id="gerr" role="alert"></div>
    <p class="hint">Preview login: admin@anuvesha.com / admin2026</p>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="logo"><b>ANU<i>V</i>ESHA</b><small>ADMIN</small></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot"><a href="https://anuvesha.teenfounders.world/" target="_blank" rel="noopener">View main website ↗</a><button class="btn alt sm" id="out">Log out</button></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="pd">
  <h2 id="pdt">Add product</h2>
  <form id="pf" novalidate>
    <label>Product name<input id="pn"></label>
    <label>Palette<select id="pp"><option>Jewel-Toned</option><option>Pastel Minimalism</option></select></label>
    <div class="grid2"><label>Price (₹)<input id="ppr" type="number" min="0"></label><label>Original price (₹, optional)<input id="pmr" type="number" min="0"></label></div>
    <label>Stock<input id="pst" type="number" min="0"></label>
    <div class="sz" id="psz"></div>
    <div class="err" id="perr" role="alert"></div>
    <div class="acts"><button class="btn">Save product</button><button type="button" class="btn alt" id="pc">Cancel</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

var main=document.getElementById('main'),toast=document.getElementById('toast'),tt;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},1800)}
function R(n){return '₹'+Number(n).toLocaleString('en-IN')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pr(id){return S.P.filter(function(x){return x.id===id})[0]}
function tot(o){return o.it.reduce(function(a,i){return a+pr(i[0]).p*i[2]},0)}
function names(o){return o.it.map(function(i){return pr(i[0]).n+' ('+i[1]+') ×'+i[2]}).join(', ')}
function nav(){document.getElementById('nav').innerHTML=V.map(function(v){var b=v[0]==='messages'?S.M.filter(function(m){return !m.r}).length:0;return '<button data-v="'+v[0]+'" aria-current="'+(S.v===v[0])+'">'+v[1]+(b?' ('+b+')':'')+'</button>'}).join('')}
function demo(){return '<p class="demo">Preview with sample data. Changes here are not saved and don’t change the main website yet.</p>'}
function overview(){
  var rev=S.O.reduce(function(a,o){return a+tot(o)},0),open=S.O.filter(function(o){return o.s<4}).length,lowL=S.P.filter(function(p){return p.st<=5});
  var days=[['Tue',3],['Wed',5],['Thu',2],['Fri',6],['Sat',4],['Sun',7],['Mon',5]],mx=7;
  return '<h1>Overview</h1><p class="sub">How the atelier is doing this week.</p>'+demo()+
  '<div class="card" style="margin-bottom:22px"><h2>Website banner right now</h2><div id="live">'+liveBn()+'</div><button class="btn alt sm" style="margin-top:12px" data-act="gof">Manage festivals &amp; offers</button></div>'+
  '<div class="stats"><div class="card"><b>'+R(rev)+'</b><span>Revenue</span></div><div class="card"><b>'+S.O.length+'</b><span>Orders</span></div><div class="card"><b>'+open+'</b><span>Being made or shipped</span></div><div class="card"><b>'+lowL.length+'</b><span>Low or out of stock</span></div></div>'+
  '<div class="card" style="margin-bottom:22px"><h2>Orders this week</h2><div class="chart">'+days.map(function(d){return '<div><i style="height:'+(d[1]/mx*90)+'px"></i>'+d[0]+'</div>'}).join('')+'</div></div>'+
  '<div class="card" style="margin-bottom:22px"><h2>Needs restocking</h2>'+(lowL.length?lowL.map(function(p){return '<div class="row" style="margin-bottom:8px"><div class="grow"><b>'+esc(p.n)+'</b></div><span class="low">'+(p.st?p.st+' left':'Out of stock')+'</span></div>'}).join(''):'<p class="sub" style="margin:0">Everything is well stocked.</p>')+'</div>'+
  '<h2>Latest orders</h2><div class="list">'+S.O.slice(0,4).map(function(o){return '<div class="row"><div class="grow"><b>'+o.id+' · '+esc(o.c)+'</b><small>'+esc(names(o))+'</small></div><span class="tag">'+ST[o.s]+'</span><b>'+R(tot(o))+'</b></div>'}).join('')+'</div>'}
function products(){
  return '<div class="bar"><div><h1>Products</h1><p class="sub" style="margin:0">'+S.P.length+' pieces in the catalogue.</p></div><button class="btn" data-act="add">Add product</button></div>'+demo()+
  '<div class="list">'+S.P.map(function(p){return '<div class="row"><img src="'+p.img+'" alt=""><div class="grow"><b>'+esc(p.n)+'</b><small>'+p.pal+' · '+p.sz.join(' ')+'</small></div><span><b>'+R(p.p)+'</b>'+(p.mrp?' <small><s>'+R(p.mrp)+'</s></small>':'')+'</span>'+
  '<label style="margin:0;font-size:12px">Stock<input type="number" min="0" value="'+p.st+'" data-ch="st" data-id="'+p.id+'" class="'+(p.st<=5?'low':'')+'"></label>'+
  '<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(p.vis?'checked':'')+' data-ch="vis" data-id="'+p.id+'">Shown</label>'+
  '<button class="btn alt sm" data-act="edit" data-id="'+p.id+'">Edit</button><button class="btn alt sm" data-act="del" data-id="'+p.id+'">Delete</button></div>'}).join('')+'</div>'}
function orderRows(){
  var q=S.q.toLowerCase();
  var L=S.O.filter(function(o){return (S.of==='All'||ST[o.s]===S.of)&&(!q||(o.id+' '+o.c).toLowerCase().indexOf(q)>-1)});
  return L.length?L.map(function(o){return '<div class="row"><div class="grow"><b>'+o.id+' · '+esc(o.c)+'</b><small>'+o.d+' · '+o.pay+' · '+esc(names(o))+'</small></div><b>'+R(tot(o))+'</b><select aria-label="Status for '+o.id+'" data-ch="os" data-id="'+o.id+'">'+ST.map(function(s,i){return '<option value="'+i+'"'+(i===o.s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+(o.note?'<span class="note">Note: '+esc(o.note)+'</span>':'')+'</div>'}).join(''):'<p class="sub">No orders found.</p>'}
function orders(){
  var f=['All'].concat(ST);
  return '<h1>Orders</h1><p class="sub">Move each pre-order along as it’s woven, dyed and shipped.</p>'+demo()+
  '<input id="oq" type="search" placeholder="Search by name or order number" aria-label="Search orders" value="'+esc(S.q)+'" style="margin:0 0 14px">'+
  '<div class="chips">'+f.map(function(x){return '<button data-act="of" data-f="'+x+'" aria-pressed="'+(S.of===x)+'">'+x+'</button>'}).join('')+'</div><div class="list" id="ol">'+orderRows()+'</div>'}
function messages(){
  return '<h1>Messages</h1><p class="sub">Notes from customers to the founders.</p>'+demo()+'<div class="list">'+S.M.map(function(m,i){return '<div class="row'+(m.r?'':' unread')+'"><div class="grow"><b>'+esc(m.n)+' <span class="tag">'+esc(m.t)+'</span></b><small>'+esc(m.c)+'</small><p style="margin:6px 0 0">'+esc(m.m)+'</p></div><button class="btn alt sm" data-act="read" data-i="'+i+'">'+(m.r?'Mark unread':'Mark read')+'</button></div>'}).join('')+'</div>'}
function policies(){
  var p=S.L[S.pt];
  return '<h1>Policies</h1><p class="sub">Edit the text of each policy page.</p>'+demo()+
  '<div class="chips">'+S.L.map(function(l,i){return '<button data-act="pt" data-i="'+i+'" aria-pressed="'+(S.pt===i)+'">'+l[0]+'</button>'}).join('')+'</div>'+
  '<div class="card"><p class="hint" style="margin:0 0 10px">Page: '+p[1]+' · Last updated: '+S.U[S.pt]+'</p><label style="margin:0">Policy text<textarea id="ptx">'+esc(p[2])+'</textarea></label><div class="acts" style="margin-top:14px"><button class="btn" data-act="psave">Save policy</button></div></div>'}
function settings(){
  var x=S.X;
  return '<h1>Settings</h1><p class="sub">Banner, offers and delivery.</p>'+demo()+
  '<div class="card"><label>Announcement bar text<input id="sa" value="'+esc(x.ann)+'"></label><div class="grid2"><label>Coupon code<input id="sc" value="'+esc(x.code)+'"></label><label>Discount (%)<input id="sp" type="number" min="0" max="100" value="'+x.pct+'"></label></div><label>Free courier above (₹)<input id="sf" type="number" min="0" value="'+x.free+'"></label><button class="btn" data-act="ssave">Save settings</button></div>'}
function fd(s){if(!s)return '—';var p=s.split('-'),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return Number(p[2])+' '+M[Number(p[1])-1]+' '+p[0]}
function dleft(s){if(!s)return '';var n=Math.round((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/864e5);return n===0?'Today':n>0?'In '+n+(n===1?' day':' days'):'Passed'}
function bn(f){return '<div class="ban" style="background:'+f.bg+';color:'+f.fg+'"><b>'+esc(f.g)+'</b>'+(f.o?' · '+esc(f.o):'')+(f.code?' · Code <u>'+esc(f.code)+'</u> for '+f.pct+'% off':'')+'</div>'}
function liveBn(){var f=S.F.filter(function(x){return x.on})[0];return f?bn(f):'<div class="ban" style="background:#1D1B1A;color:#F5EEE0">'+esc(S.X.ann)+'</div>'}
function festivals(){
  return '<div class="bar"><div><h1>Festivals &amp; offers</h1><p class="sub" style="margin:0">Greetings and special offers for the top of your website.</p></div><button class="btn" data-act="addf">Add custom offer</button></div>'+demo()+
  '<h2>What visitors see now</h2><div id="live" style="margin-bottom:26px">'+liveBn()+'</div><div class="list">'+
  S.F.map(function(f,i){var inp=function(k,l,t){return '<label>'+l+'<input type="'+(t||'text')+'" value="'+esc(f[k])+'" data-ch="fe" data-i="'+i+'" data-k="'+k+'"></label>'};
  return '<div class="card"><div class="bar" style="margin-bottom:10px"><div><b>'+esc(f.n)+'</b> <span class="tag">'+fd(f.d)+' · '+dleft(f.d)+'</span></div><label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(f.on?'checked':'')+' data-ch="fe" data-i="'+i+'" data-k="on">Show on website</label></div><div id="fp'+i+'" style="margin-bottom:12px">'+bn(f)+'</div>'+
  '<details><summary>Edit greeting, offer, code and dates</summary><div class="grid2">'+inp('n','Festival name')+inp('d','Festival date','date')+inp('g','Greeting')+inp('o','Offer line')+inp('code','Coupon code')+inp('pct','Discount (%)','number')+inp('from','Show from','date')+inp('to','Show until','date')+'</div><button class="btn alt sm" style="margin-top:6px" data-act="delf" data-i="'+i+'">Remove</button></details></div>'}).join('')+'</div>'}
function customers(){
  var m={};S.O.forEach(function(o){var c=m[o.c]||(m[o.c]={n:o.c,k:0,t:0,d:o.d});c.k++;c.t+=tot(o)});
  var L=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.t-a.t});
  return '<h1>Customers</h1><p class="sub">Built from your orders, top spenders first.</p>'+demo()+'<div class="list">'+L.map(function(c){return '<div class="row"><div class="grow"><b>'+esc(c.n)+'</b><small>Last order '+c.d+'</small></div><span class="tag">'+c.k+(c.k>1?' orders':' order')+'</span><b>'+R(c.t)+'</b></div>'}).join('')+'</div>'}
function render(){nav();main.innerHTML={overview:overview,products:products,orders:orders,messages:messages,policies:policies,settings:settings,festivals:festivals,customers:customers}[S.v]()}
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(b){S.v=b.dataset.v;render();window.scrollTo(0,0)}});
var pd=document.getElementById('pd');
function openP(p){S.edit=p?p.id:null;document.getElementById('pdt').textContent=p?'Edit product':'Add product';
  document.getElementById('pn').value=p?p.n:'';document.getElementById('pp').value=p?p.pal:'Jewel-Toned';document.getElementById('ppr').value=p?p.p:'';document.getElementById('pmr').value=p&&p.mrp?p.mrp:'';document.getElementById('pst').value=p?p.st:'';
  document.getElementById('psz').innerHTML=SZ.map(function(z){return '<label><input type="checkbox" value="'+z+'"'+((p?p.sz:['S','M','L']).indexOf(z)>-1?' checked':'')+'>'+z+'</label>'}).join('');
  document.getElementById('perr').textContent='';pd.showModal()}
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=Number(b.dataset.id);
  if(a==='add')return openP();
  if(a==='edit')return openP(pr(id));
  if(a==='del'){if(confirm('Delete this product?')){S.P=S.P.filter(function(p){return p.id!==id});render();say('Product deleted')}return}
  if(a==='of'){S.of=b.dataset.f}
  if(a==='read'){var m=S.M[b.dataset.i];m.r=m.r?0:1}
  if(a==='pt'){S.pt=Number(b.dataset.i)}
  if(a==='addf'){S.F.push({n:'Custom offer',d:'',g:'Special offer',o:'',code:'',pct:10,from:'',to:'',on:0,bg:'#1D1B1A',fg:'#F5EEE0'});say('Offer added')}
  if(a==='delf'){S.F.splice(Number(b.dataset.i),1);say('Offer removed')}
  if(a==='gof'){S.v='festivals'}
  if(a==='psave'){S.L[S.pt][2]=document.getElementById('ptx').value;S.U[S.pt]='Just now';say('Policy saved')}
  if(a==='ssave'){S.X={ann:document.getElementById('sa').value,code:document.getElementById('sc').value.toUpperCase(),pct:Number(document.getElementById('sp').value)||0,free:Number(document.getElementById('sf').value)||0};say('Settings saved')}
  render()});
main.addEventListener('change',function(e){var t=e.target,c=t.dataset.ch;if(!c)return;
  if(c==='fe'){var fi=Number(t.dataset.i),f=S.F[fi],k=t.dataset.k;
    if(k==='on'){var on=t.checked;S.F.forEach(function(x){x.on=0});f.on=on?1:0;say(on?'Banner is now live':'Banner turned off');render()}
    else{f[k]=k==='pct'?Number(t.value)||0:t.value;var fp=document.getElementById('fp'+fi);if(fp)fp.innerHTML=bn(f);var lv=document.getElementById('live');if(lv)lv.innerHTML=liveBn();say('Saved')}}
  if(c==='st'){var p=pr(Number(t.dataset.id));p.st=Math.max(0,Number(t.value)||0);say('Stock updated');render()}
  if(c==='vis'){pr(Number(t.dataset.id)).vis=t.checked?1:0;say(t.checked?'Product shown':'Product hidden')}
  if(c==='os'){S.O.filter(function(o){return o.id===t.dataset.id})[0].s=Number(t.value);say('Order moved to '+ST[Number(t.value)]);render()}});
main.addEventListener('input',function(e){if(e.target.id==='oq'){S.q=e.target.value;document.getElementById('ol').innerHTML=orderRows()}});
